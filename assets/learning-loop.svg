<text x="480" y="428" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="26" font-weight="600" fill="#f5f5f5">Scoped guidance</text>
<text x="480" y="464" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="19" fill="#f5f5f5">Existing topic + permission</text>
<text x="480" y="494" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="18" fill="#f5f5f5">No new memory service</text>
<line x1="48" y1="756" x2="912" y2="756" stroke="#bfc0c0"/>
<text x="48" y="792" font-family="Helvetica,sans-serif" font-size="20" fill="#2d3142">Solid: learning cycle  /  Dashed: guidance consulted or refined</text>
<text x="48" y="824" font-family="Helvetica,sans-serif" font-size="18" fill="#4f5d75">Conceptual method. The executing agent acts; Markdown does not run itself.</text>
</svg>
