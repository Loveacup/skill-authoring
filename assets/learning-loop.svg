<path d="M356.000 407.344 L356.000 407.344" fill="none" stroke="#5a6580" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="360.0" y="146.0" width="240" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="2"/>
<text x="480.0" y="182.0" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="26" font-weight="600" fill="#2d3142">Use</text>
<text x="480.0" y="214.0" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="18" fill="#4f5d75">Do the actual work</text>
<rect x="604.0" y="322.0" width="240" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="2"/>
<text x="724.0" y="358.0" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="26" font-weight="600" fill="#2d3142">Observe</text>
<text x="724.0" y="390.0" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="18" fill="#4f5d75">Meaningful feedback</text>
<rect x="512.0" y="610.0" width="240" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="2"/>
<text x="632.0" y="646.0" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="26" font-weight="600" fill="#2d3142">Retain</text>
<text x="632.0" y="678.0" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="18" fill="#4f5d75">Scoped experience</text>
<rect x="208.0" y="610.0" width="240" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="2"/>
<text x="328.0" y="646.0" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="26" font-weight="600" fill="#2d3142">Retrieve</text>
<text x="328.0" y="678.0" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="18" fill="#4f5d75">At the next decision</text>
<rect x="116.0" y="322.0" width="240" height="92" rx="6" fill="#f7e9e4" stroke="#bf4520" stroke-width="2"/>
<text x="236.0" y="358.0" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="26" font-weight="600" fill="#bf4520">Revise + check</text>
<text x="236.0" y="390.0" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="18" fill="#4f5d75">Evidence, not confidence</text>
