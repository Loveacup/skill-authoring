<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="learning-loop-title learning-loop-desc">
<title id="learning-loop-title">Learning through use, not background automation</title>
<desc id="learning-loop-desc">The agent uses a skill, observes meaningful feedback, retains scoped experience, retrieves it at the next decision, then revises and checks within authorization; both target skills and Skill Authoring use this method.</desc>
<defs><marker id="learning-loop-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker></defs>
<rect width="960" height="840" fill="#f5f5f5"/>
<text x="48" y="56" font-family="Georgia,serif" font-size="40" fill="#2d3142">Better skills. Better next decisions.</text>
<text x="48" y="96" font-family="Helvetica,sans-serif" font-size="22" fill="#4f5d75">One method for target skills and Skill Authoring itself.</text>
